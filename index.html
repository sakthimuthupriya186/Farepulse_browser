<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Single File Website</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
        }

        /* Header */
        header {
            background-color: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        header nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .hero button {
            margin-top: 20px;
            padding: 12px 28px;
            border: none;
            background-color: #f59e0b;
            color: white;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero button:hover {
            background-color: #d97706;
        }

        /* Services Section */
        .services {
            padding: 50px 20px;
            text-align: center;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 250px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #1e293b;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><strong>MyBrand</strong></div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Services</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Single File Website</h1>
        <p>GitHub-la ore file upload panni run panra awesome website!</p>
        <button id="clickBtn">Click Me!</button>
    </section>

    <section id="services" class="services">
        <h2>Our Features</h2>
        <div class="card-container">
            <div class="card">
                <h3>Easy Deployment</h3>
                <p>Just one index.html file needed for GitHub Pages.</p>
            </div>
            <div class="card">
                <h3>Fully Responsive</h3>
                <p>Mobile and Desktop support built-in.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 MyBrand. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('clickBtn').addEventListener('click', function() {
            alert('Super! Single file website sariyaga work aagudhu!');
        });
    </script>
</body>
</html>
